<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN Cognitive Desktop</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
header{background:#1e293b;padding:1rem 2rem;border-bottom:1px solid #334155}
h1{font-size:1.25rem;color:#22d3ee}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:1rem;padding:1rem}
.card{background:#1e293b;border-radius:8px;padding:1rem;border:1px solid #334155}
.card h2{font-size:.9rem;color:#94a3b8;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em}
.entity,.msg,.event{padding:.5rem;border-bottom:1px solid #1e293b;font-size:.85rem}
.entity:last-child,.msg:last-child,.event:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:.7rem;margin-right:4px}
.tag-thought{background:#1e40af}.tag-decision{background:#854d0e}.tag-model{background:#166534}
.tag-session{background:#6b21a8}.tag-collision{background:#991b1b}.tag-msg{background:#0e7490}
input,textarea,button{padding:6px 8px;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.8rem;margin:4px 0}
button{background:#22d3ee;color:#0f172a;border:none;cursor:pointer;font-weight:600}
button:hover{background:#06b6d4}
.collision-warn{background:#451a03;border-left:3px solid #f59e0b;padding:.5rem;margin-bottom:.5rem;font-size:.8rem}
</style>
</head>
<body x-data="dashboard()" x-init="init()">
<header>
  <h1>🧠 LUMEN Cognitive Desktop</h1>
  <span style="font-size:.75rem;color:#64748b" x-text="status"></span>
</header>

<div class="grid">
  <!-- Wiki Editor -->
  <div class="card">
    <h2>📝 Wiki Mental</h2>
    <input placeholder="Nombre entidad" x-model="newEntity.name" @keyup.enter="addEntity()">
    <input placeholder="Rol" x-model="newEntity.role">
    <input placeholder="Notas" x-model="newEntity.notes">
    <textarea placeholder="Relaciones (coma)" x-model="newEntity.relationships"></textarea>
    <textarea placeholder="Properties (JSON)" x-model="newEntity.properties"></textarea>
    <button @click="addEntity()">Añadir</button>
    <div style="margin-top:.5rem">
      <template x-for="e in entities" :key="e.name">
        <div class="entity">
          <strong x-text="e.name"></strong>
          <span class="tag tag-model" x-text="e.role||'?'"></span>
          <div style="font-size:.75rem;color:#94a3b8" x-text="e.notes?.slice(0,80)"></div>
        </div>
      </template>
    </div>
  </div>

  <!-- Session Monitor -->
  <div class="card">
    <h2>📡 Sesiones (<span x-text="sessions.length"></span>)</h2>
    <template x-for="s in sessions" :key="s.session_id">
      <div class="entity">
        <strong x-text="s.session_id"></strong>
        <span style="font-size:.7rem;color:#64748b" x-text="s.label"></span>
        <div style="font-size:.75rem">
          🧵<span x-text="s.chains"></span>
          🔧<span x-text="s.tool_calls"></span>
          🧩<span x-text="s.model_entities"></span>
        </div>
      </div>
    </template>
  </div>

  <!-- Collisions -->
  <div class="card">
    <h2>⚠️ Colisiones</h2>
    <template x-for="c in collisions" :key="c.file">
      <div class="collision-warn">
        📁 <strong x-text="c.file||c.path"></strong>
        <span x-text="c.sessions?.length+' sesiones'"></span>
      </div>
    </template>
    <div x-show="collisions.length===0" style="font-size:.8rem;color:#64748b">Sin colisiones</div>
  </div>

  <!-- Timeline -->
  <div class="card" style="max-height:400px;overflow-y:auto">
    <h2>⏱️ Timeline</h2>
    <template x-for="e in timeline" :key="e.ts+e.type+e.text">
      <div class="event">
        <span :class="'tag tag-'+e.type" x-text="e.type"></span>
        <span style="font-size:.7rem;color:#64748b" x-text="e.session"></span>
        <div style="font-size:.8rem" x-text="e.text"></div>
      </div>
    </template>
  </div>

  <!-- Inbox -->
  <div class="card">
    <h2>📨 Inbox</h2>
    <select x-model="inboxSession" style="margin-bottom:.5rem">
      <option value="default">default</option>
      <template x-for="s in sessions" :key="s.session_id">
        <option :value="s.session_id" x-text="s.session_id"></option>
      </template>
    </select>
    <textarea placeholder="Mensaje" x-model="msgText" rows="2"></textarea>
    <button @click="sendMsg()">Enviar</button>
    <template x-for="m in inbox" :key="m.timestamp">
      <div class="msg">
        <strong x-text="m.from_session"></strong>
        <span style="font-size:.7rem;color:#64748b" x-text="new Date(m.timestamp*1000).toLocaleTimeString()"></span>
        <div x-text="m.text"></div>
      </div>
    </template>
  </div>
</div>

<script>
function dashboard() {
  return {
    status: 'conectando...',
    entities: [], sessions: [], collisions: [], timeline: [], inbox: [],
    newEntity: {name:'',role:'',notes:'',relationships:'',properties:'{}'},
    inboxSession: 'default', msgText: '',
    API: 'http://127.0.0.1:9878',

    async init() {
      await this.refresh()
      setInterval(() => this.refresh(), 5000)
    },

    async refresh() {
      try {
        let [e,s,c,t] = await Promise.all([
          fetch(this.API+'/model/stats').then(r=>r.json()).catch(()=>({})),
          fetch(this.API+'/sessions').then(r=>r.json()).catch(()=>({sessions:[]})),
          fetch(this.API+'/collisions').then(r=>r.json()).catch(()=>[]),
          fetch(this.API+'/timeline?limit=20').then(r=>r.json()).catch(()=>[]),
        ])
        this.entities = (e && e.entities) ? e.entities : []
        this.sessions = (s && s.sessions) || []
        this.collisions = Array.isArray(c) ? c : (c && c.collisions || [])
        this.timeline = t || []
        this.status = '✅ ' + new Date().toLocaleTimeString()
      } catch(err) {
        this.status = '❌ ' + err.message
      }
    },

    async addEntity() {
      let n = this.newEntity
      let rels = n.relationships ? n.relationships.split(',').map(s=>s.trim()).filter(Boolean) : []
      let props = {}
      try { props = JSON.parse(n.properties||'{}') } catch {}
      await fetch(this.API+'/model', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({entity:n.name, deps:rels, role:n.role, notes:n.notes, properties:props})
      })
      this.newEntity = {name:'',role:'',notes:'',relationships:'',properties:'{}'}
      await this.refresh()
    },

    async sendMsg() {
      if (!this.msgText.trim()) return
      await fetch(this.API+'/inbox', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({to:this.inboxSession, from:'dashboard', text:this.msgText})
      })
      this.msgText = ''
      // Reload inbox
      let r = await fetch(this.API+'/inbox/'+this.inboxSession).then(r=>r.json())
      this.inbox = r.messages || []
    }
  }
}
</script>
</body>
</html>
