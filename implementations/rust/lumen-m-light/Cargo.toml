[package]
name = "lumen-m-light"
version = "0.1.0"
edition = "2021"
description = "M-Light compiler and resumable stack VM for LUMEN agents"
license = "MIT"

[lib]
name = "lumen_mlight"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
ureq = { version = "3", optional = true }
minreq = { version = "2", optional = true, features = ["json-using-serde", "https-rustls"] }
wasm-bindgen = { version = "0.2", optional = true }
libloading = { version = "0.8", optional = true }

[features]
default = ["sqlite", "minreq", "dll"]
# Motor de persistencia SQLite (solo nativo). En WASM se compila con
# --no-default-features --features wasm (globals en RAM, sin rusqlite).
debug_for = []
sqlite = ["dep:rusqlite"]
dll = ["dep:libloading"]
wasm = ["wasm-bindgen"]
