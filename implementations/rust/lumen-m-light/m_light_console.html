<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⬡ MVM iPhone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#ddd;height:100vh;display:flex;flex-direction:column}
#h{background:#111;padding:8px 12px;font-size:13px;border-bottom:1px solid #222;flex-shrink:0;display:flex;justify-content:space-between}
#h .s{color:#51cf66;font-size:10px}
#out{flex:1;overflow-y:auto;padding:8px 12px;font-family:Consolas,monospace;font-size:13px;line-height:1.4}
#inp{display:flex;padding:6px;background:#111;border-top:1px solid #222;flex-shrink:0}
#inp input{flex:1;background:#1a1a22;border:1px solid #333;color:#ddd;padding:8px;font-family:Consolas,monospace;font-size:14px;border-radius:4px}
#inp button{background:#51cf6622;border:1px solid #51cf6644;color:#51cf66;padding:8px 14px;margin-left:6px;border-radius:4px;font-size:13px}
#inp button:active{background:#51cf6644}
.log{color:#888;font-size:11px}.ok{color:#51cf66}.err{color:#ff6b6b}.val{color:#ffd43b}
</style>
</head>
<body>
<div id="h"><span>⬡ MVM</span><span class="s" id="status">●</span></div>
<pre id="out"><span class="log">Cargando...</span></pre>
<div id="inp"><input id="cmd" placeholder="S x=42 W x Q" autofocus><button onclick="run()">▶</button></div>

<script type="module">
import * as wasm from "./pkg/lumen_mlight.js";

await wasm.default();
window._wasm = { 
    m_compile: wasm.m_compile, 
    m_execute: wasm.m_execute, 
    m_version: wasm.m_version 
};
document.getElementById("status").textContent = "WASM v" + wasm.m_version();
log("⬡ M-Light WASM listo", "ok");
log("Ejemplos: S x=42 W x Q | F i=1:1:5 W i,\" \" Q", "log");
</script>
<script>
const out = document.getElementById("out");
const status = document.getElementById("status");

function log(msg, cls="") {
    out.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    out.scrollTop = out.scrollHeight;
}

async function run() {
    const cmd = document.getElementById("cmd").value.trim();
    if (!cmd) return;
    document.getElementById("cmd").value = "";
    log("> " + cmd, "val");
    
    const { m_compile, m_execute } = window._wasm;
    try {
        // Pull globals from server
        status.textContent = "⏳";
        const ns = "TEST";
        let globals = "[]";
        try {
            const r = await fetch(`http://192.168.1.11:8081/ddp/pull?ns=${ns}`);
            const d = await r.json();
            if (d.entries) globals = JSON.stringify(d.entries);
        } catch(e) {
            log("(offline - sin datos remotos)", "log");
        }
        
        // Compile + execute
        const compiled = m_compile(cmd);
        const t0 = performance.now();
        const output = m_execute(compiled, globals);
        const ms = (performance.now() - t0).toFixed(1);
        
        if (output) log(output, "ok");
        log(`⏱ ${ms}ms`, "log");
        status.textContent = "●";
    } catch(e) {
        const msg = String(e);
        const m = msg.match(/line (\d+)|<(.+)>/i);
        if (m) log(`❌ <${m[2] || 'SYNTAX'}> linea ${m[1] || '?'}`, "err");
        else log("❌ " + msg, "err");
        status.textContent = "●";
    }
}

document.getElementById("cmd").addEventListener("keydown", e => {
    if (e.key === "Enter") run();
});
</script>
</body>
</html>
