<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⬡ M-Light Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#ddd;height:100vh;display:flex;flex-direction:column}
#h{background:#111;padding:8px 12px;font-size:13px;border-bottom:1px solid #222;flex-shrink:0;display:flex;justify-content:space-between}
#h .s{color:#51cf66;font-size:10px}
#out{flex:1;overflow-y:auto;padding:8px 12px;font-family:Consolas,monospace;font-size:13px;line-height:1.4}
#inp{display:flex;padding:6px;background:#111;border-top:1px solid #222;flex-shrink:0}
#inp input{flex:1;background:#1a1a22;border:1px solid #333;color:#ddd;padding:8px;font-family:Consolas,monospace;font-size:14px;border-radius:4px}
#inp button{background:#51cf6622;border:1px solid #51cf6644;color:#51cf66;padding:8px 14px;margin-left:6px;border-radius:4px;font-size:13px}
#inp button:active{background:#51cf6644}
.log{color:#888;font-size:11px}.ok{color:#51cf66}.err{color:#ff6b6b}.val{color:#ffd43b}
</style>
</head>
<body>
<div id="h"><span>⬡ M-Light</span><span class="s" id="status">●</span></div>
<pre id="out"><span class="log">Cargando...</span></pre>
<div id="inp"><input id="cmd" placeholder="S x=42 W x Q" autofocus><button onclick="run()">▶</button></div>

<script type="module">
import * as wasm from "./pkg/lumen_mlight.js";
await wasm.default();

const SYS = {};
function def(name, code) { try { SYS[name] = wasm.m_compile(code); } catch(e) {} }

// %SS: WASM runtime info — usa GOTO, no FOR+Q (bug M-Light compiler)
def("^%SS",
`%SS W "=== LUMEN ===",! W "Engine: WASM v0.1",! W "Host: Console",! W !,"--- Agents ---",!
 N pid,st S pid=""
A1 S pid=\$O(^HEARTBEAT(pid)) G:pid="" A2
 S st=\$P(\$G(^HEARTBEAT(pid)),"|",2)
 W !,"  ",pid," = ",st
 G A1
A2 Q`);

// %ZW: ZWrite de ^GLOBAL (MSM-style)
def("^%ZW",
`%ZW W "=== ZWrite ===",! N ns,k,v S ns=\"\" F  ns=\$O(^GLOBAL_SIZES(ns)) Q:ns=\"\"  D . W !,\"^\",ns,\":\",! . S k=\"\" F  k=\$O(@(\"^\"_ns_\"(\"\"\"_k_\"\"\")\")) Q:k=\"\"  D . . S v=\$G(@(\"^\"_ns_\"(\"\"\"_k_\"\"\")\")) . . W \"  \",k,\" = \",v,! W ! Q`);
def("^%GL",
`%GL W "=== ^GLOBALes ===",!
 N ns,s,t S t=0,ns=""
G1 S ns=\$O(^GLOBAL_SIZES(ns)) G:ns="" G2
 S s=\$G(^GLOBAL_SIZES(ns),0) S t=t+s
 W !,"  ^",ns,": ",s
 G G1
G2 W !,"Total: ",t,! Q`);

window._wasm = { m_compile: wasm.m_compile, m_execute: wasm.m_execute, m_version: wasm.m_version, sys: SYS };
document.getElementById("status").textContent = "v" + wasm.m_version();
log("⬡ M-Light Console", "ok");
log("Rutinas: " + Object.keys(SYS).join(" "), "log");
</script>
<script>
const out = document.getElementById("out"), status = document.getElementById("status");

function log(msg, cls="") {
    out.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    out.scrollTop = out.scrollHeight;
}

async function run() {
    let cmd = document.getElementById("cmd").value.trim();
    if (!cmd) return;
    document.getElementById("cmd").value = "";
    log("> " + cmd, "val");
    const { m_compile, m_execute, sys } = window._wasm;
    const dMatch = cmd.match(/^d\s+\^?([\w%]+)/i);
    const rn = dMatch ? "^" + dMatch[1].toUpperCase() : null;
    
    // ZW ^NS — ZWrite a ^GLOBAL
    const zwMatch = cmd.match(/^zw\s+\^?(\w+)/i);
    if (zwMatch) {
        const ns = zwMatch[1].toUpperCase();
        cmd = `W "=== ZWrite ^${ns} ===",! N k,v S k="" F  S k=\\$O(^${ns}(k)) Q:k=""  S v=\\$G(^${ns}(k)) W !,"  ",k," = ",v Q`;
    }

    try {
        let globals = "[]";
        try {
            const r = await fetch("http://192.168.1.11:8081/ddp/pull?ns=_all_");
            const d = await r.json();
            if (d.success && d.entries) globals = JSON.stringify(d.entries);
        } catch(e) {}

        const compiled = (rn && sys[rn]) ? sys[rn] : m_compile(cmd);
        const t0 = performance.now();
        const output = m_execute(compiled, globals);
        const ms = (performance.now() - t0).toFixed(1);

        if (output) log(output, "ok");
        log(`⏱ ${ms}ms`, "log");
        status.textContent = "●";
    } catch(e) {
        const msg = String(e);
        if (msg.includes("compile error")) log("❌ <SYNTAX> " + msg.split("compile error: ")[1], "err");
        else if (msg.includes("runtime error")) log("❌ <RUNTIME> " + msg.split("runtime error: ")[1], "err");
        else log("❌ " + msg.substring(0,120), "err");
        status.textContent = "●";
    }
}
document.getElementById("cmd").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
