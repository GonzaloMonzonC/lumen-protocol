<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⬡ MVM Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#ddd;height:100vh;display:flex;flex-direction:column}
#h{background:#111;padding:8px 12px;font-size:13px;border-bottom:1px solid #222;flex-shrink:0;display:flex;justify-content:space-between}
#h .s{color:#51cf66;font-size:10px}
#out{flex:1;overflow-y:auto;padding:8px 12px;font-family:Consolas,monospace;font-size:13px;line-height:1.4}
#inp{display:flex;padding:6px;background:#111;border-top:1px solid #222;flex-shrink:0}
#inp input{flex:1;background:#1a1a22;border:1px solid #333;color:#ddd;padding:8px;font-family:Consolas,monospace;font-size:14px;border-radius:4px}
#inp button{background:#51cf6622;border:1px solid #51cf6644;color:#51cf66;padding:8px 14px;margin-left:6px;border-radius:4px;font-size:13px}
#inp button:active{background:#51cf6644}
.log{color:#888;font-size:11px}.ok{color:#51cf66}.err{color:#ff6b6b}.val{color:#ffd43b}
</style>
</head>
<body>
<div id="h"><span>⬡ MVM</span><span class="s" id="status">●</span></div>
<pre id="out"><span class="log">Cargando...</span></pre>
<div id="inp"><input id="cmd" placeholder="S ^a=1 W ^a" autofocus><button onclick="run()">▶</button></div>

<script type="module">
import * as wasm from "./pkg/lumen_mlight.js";
await wasm.default();

const SYS = {};
function def(name, code) { try { SYS[name] = wasm.m_compile(code); } catch(e) {} }

def("^%SS",
`%SS W "Engine: WASM",! N pid,st S pid="" S pid=$O(^HEARTBEAT(pid)) G:pid="" S2
S1 S st=$P($G(^HEARTBEAT(pid)),"|",2) W "  ",pid," = ",st,! S pid=$O(^HEARTBEAT(pid)) G:pid="" S1
S2 Q`);

def("^%GL",
`%GL W "^GLOBALes:",! N ns,s,t S t=0,ns="" S ns=$O(^GLOBAL_SIZES(ns)) G:ns="" G2 W "  ^",ns," = ",$G(^GLOBAL_SIZES(ns)),! S ns=$O(^GLOBAL_SIZES(ns)) G:ns="" G2
G2 W "Total: ",t,! Q`);

window._wasm = { m_compile: wasm.m_compile, m_execute_raw: wasm.m_execute_raw, m_version: wasm.m_version, sys: SYS };

// Estado persistente: los ^GLOBALes del usuario
let _sessionGlobals = [];  // entradas acumuladas entre comandos
let _ddpGlobals = [];      // entradas del servidor DDP

// Cargar DDP inicial
try {
    const r = await fetch("http://192.168.1.11:8081/ddp/pull?ns=_all_");
    const d = await r.json();
    if (d.success && d.entries) _ddpGlobals = d.entries;
} catch(e) {}

document.getElementById("status").textContent = "v" + wasm.m_version();
log("⬡ MVM Console listo", "ok");
log("Rutinas: " + Object.keys(SYS).join(" "), "log");
</script>
<script>
const out = document.getElementById("out"), status = document.getElementById("status");

function log(msg, cls="") { out.innerHTML += `<span class="${cls}">${msg}</span>\n`; out.scrollTop = out.scrollHeight; }

function mergeGlobals() {
    // DDP data + session data (session overrides DDP)
    const merged = [..._ddpGlobals];
    for (const sg of _sessionGlobals) {
        const idx = merged.findIndex(e => e.ns === sg.ns && JSON.stringify(e.subs) === JSON.stringify(sg.subs));
        if (idx >= 0) merged[idx] = sg;
        else merged.push(sg);
    }
    return JSON.stringify(merged);
}

async function run() {
    let cmd = document.getElementById("cmd").value.trim();
    if (!cmd) return;
    document.getElementById("cmd").value = "";
    log("> " + cmd, "val");

    const { m_compile, m_execute_raw, sys } = window._wasm;
    const dMatch = cmd.match(/^d\s+\^?([\w%]+)/i);
    const rn = dMatch ? "^" + dMatch[1].toUpperCase() : null;

    const zwMatch = cmd.match(/^zw\s+\^?(\w+)/i);
    if (zwMatch) {
        const ns = zwMatch[1].toUpperCase();
        cmd = `N k W "=== ^${ns} ===",! S k=""\nZW1 S k=\$O(^${ns}(k)) G:k="" ZWE W "  ",k," = ",\$G(^${ns}(k)) G ZW1\nZWE W ! Q`;
    }

    try {
        // Pasar estado acumulado (DDP actual + sesión)
        // Antes de ejecutar, refrescar DDP
        try {
            const r = await fetch("http://192.168.1.11:8081/ddp/pull?ns=_all_");
            const d = await r.json();
            if (d.success && d.entries) _ddpGlobals = d.entries;
        } catch(e) {}
        
        const globals = mergeGlobals();

        const compiled = (rn && sys[rn]) ? sys[rn] : m_compile(cmd);
        const t0 = performance.now();
        const raw = JSON.parse(m_execute_raw(compiled, globals));
        const ms = (performance.now() - t0).toFixed(1);

        if (raw.error) log("❌ <" + raw.error + ">", "err");
        else if (raw.output) log(raw.output, "ok");

        // Push writes al servidor (cada write con su propio ns)
        if (raw.writes && raw.writes.length > 0) {
            for (const w of raw.writes) {
                // Convertir subs de formato Subscript {"String":"val"} a array plano
                const flatSubs = w.subs.map(s => typeof s === 'object' ? (s.String || String(s.Number || '')) : String(s));
                w.subs = flatSubs;
                _sessionGlobals = _sessionGlobals.filter(e => !(e.ns === w.ns && JSON.stringify(e.subs) === JSON.stringify(flatSubs)));
                _sessionGlobals.push({...w, subs: flatSubs});
                try {
                    await fetch("http://192.168.1.11:8081/ddp/push", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ns: w.ns, entries: [w]})
                    });
                } catch(e) {
                    log("(sin servidor DDP — escritura local)", "log");
                }
            }
        }

        log(`⏱ ${ms}ms`, "log");
        status.textContent = "●";
    } catch(e) {
        const msg = String(e);
        if (msg.includes("compile error")) log("❌ <SYNTAX> " + msg.split("compile error: ")[1], "err");
        else if (msg.includes("runtime error")) log("❌ <RUNTIME> " + msg.split("runtime error: ")[1], "err");
        else log("❌ " + msg.substring(0,120), "err");
        status.textContent = "●";
    }
}
document.getElementById("cmd").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
