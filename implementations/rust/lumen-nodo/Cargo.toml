[package]
name = "lumen-nodo"
version = "0.1.0"
edition = "2021"
description = "Nodo LUMEN — un binario, varias filas (perfil en PDB)"
license = "MIT"

[lib]
name = "lumen_nodo_lib"
path = "src/lib.rs"

[[bin]]
name = "lumen-nodo"
path = "src/main.rs"

[dependencies]
# LMDB se activa en el nodo POR DEFECTO: es el motor con mmap directo, que es
# la razón por la que un nodo puede sostener lecturas sin cargar la base en
# RAM. El perfil elige motor (sqlite | lmdb); compilar sin `lmdb` deja el nodo
# con sqlite como único motor disponible y lo dice al arrancar.
lumen = { path = ".." }
lumen-m-light = { path = "../lumen-m-light", default-features = false, features = ["sqlite", "lmdb"] }
lumen-znet = { path = "../lumen-znet", features = ["quic"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# Hash de la cadena de muestras (sign=hash-chain).
sha2 = "0.10"
# Identidad Ed25519 (identity=pubkey) y raiz de armador.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# Perfil de replicacion leido de fichero (JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["quic", "pdb", "motor-lmdb"]
quic = ["lumen/quic"]
# Lectura de ^SYS("NET",...) de la PDB sqlite viva.
pdb = ["dep:rusqlite"]
# Motor LMDB disponible para el Perfil (^SYS("NET","storage")="lmdb").
motor-lmdb = ["lumen-m-light/lmdb"]
